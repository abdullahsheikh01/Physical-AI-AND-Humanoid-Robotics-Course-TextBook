openapi: 3.0.0
info:
  title: RAG Chatbot API
  description: API for the RAG (Retrieval-Augmented Generation) Chatbot Integration with Physical AI & Humanoid Robotics E-book
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://physical-ai-and-humanoid-robotics-course-ha5u.onrender.com
    description: Production server on Render

paths:
  /chat:
    post:
      summary: Send a message to the chatbot and receive a response
      description: Processes a user query with complete chat history and returns an AI-generated response based on the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response with AI-generated answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request - invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the service and its dependencies
      responses:
        '200':
          description: Health status of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - query
        - history
      properties:
        query:
          type: string
          description: The user's question or input text
          example: "What are the key principles of Physical AI?"
        conversation_id:
          type: string
          description: Optional session identifier for conversation continuity
          example: "sess_abc123xyz"
        history:
          type: array
          description: Complete chat history for context
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [user, assistant]
                description: The role of the content sender
              content:
                type: string
                description: The content of the message
          example:
            - role: "user"
              content: "Hello"
            - role: "assistant"
              content: "Hello! How can I help you with Physical AI and Humanoid Robotics?"
            - role: "user"
              content: "What is Physical AI?"

    ChatResponse:
      type: object
      required:
        - response
        - conversation_id
        - status
      properties:
        response:
          type: string
          description: The AI-generated answer
          example: "Physical AI differs from traditional AI by focusing on..."
        conversation_id:
          type: string
          description: Session identifier
          example: "sess_abc123xyz"
        status:
          type: string
          enum: [success, error]
          description: Status of the request
          example: "success"
        sources:
          type: array
          description: Optional list of source documents used in the response
          items:
            type: object
            properties:
              doc_id:
                type: string
                description: Document identifier
              title:
                type: string
                description: Title of the source document

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: Standardized error code
          example: "CHAT_001"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid query format"
        details:
          type: object
          description: Additional error context (optional)
          example:
            field: "query"
            reason: "Field is required"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Overall health status
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
          example: "2025-01-15T10:30:00Z"
        services:
          type: object
          description: Status of external services
          properties:
            cohere:
              type: string
              enum: [connected, disconnected]
              description: Cohere API connection status
            qdrant:
              type: string
              enum: [connected, disconnected]
              description: Qdrant database connection status
            gemini:
              type: string
              enum: [connected, disconnected]
              description: Gemini API connection status